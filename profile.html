<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

<div class="card">

    <!-- Background Slider -->
    <div class="slider">
        <img src="img1.jpg" class="slide active">
        <img src="img2.jpg" class="slide">
        <img src="img3.jpg" class="slide">
    </div>

    <!-- Konten -->
    <div class="content">

        <img src="profile.jpg" class="profile">

        <h1>Reza Anugrah R.</h1>

        <p class="desc">
            Hivi! - Pelangi.

Tetaplah engkau di sini
Jangan datang lalu kau pergi
Jangan anggap hatiku
Jadi tempat persinggahanmu
Untuk cinta sesaat
        </p>
<!-- Playlist -->
<div class="music-player">

    <h3></h3>

    <div class="song-list">

        <div class="song"
            data-src="lagu1.mp3">

            <img src="cover1.jpg" alt="">

            <div class="song-info">
                <h4>Pelangi</h4>
                <span>Hivi!</span>
            </div>

            <i class="fa-solid fa-play"></i>
        </div>

        <div class="song"
            data-src="lagu2.mp3">

            <img src="cover2.jpg" alt="">

            <div class="song-info">
                <h4>Last Night on Earth</h4>
                <span>Green Day</span>
            </div>

            <i class="fa-solid fa-play"></i>
        </div>

        <div class="song"
            data-src="lagu3.mp3">

            <img src="cover3.jpg" alt="">

            <div class="song-info">
                <h4>Kuning</h4>
                <span>rumahsakit</span>
            </div>

            <i class="fa-solid fa-play"></i>
        </div>

    </div>

    <audio id="audioPlayer"></audio>

</div>

<div class="social">

    <a href="https://www.instagram.com/rrr2521_?igsh=ZHk5NmRtdGU4YXVy" class="btn">
        <i class="fab fa-instagram"></i>
        Instagram
    </a>

</div>

<script src="script.js"></script>
</body>
</html>
